name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pubspec.yaml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pubspec_version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          semver="${pubspec_version%%+*}"
          if [ "$tag" != "$semver" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version $semver" >&2
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable Windows desktop
        if: matrix.platform == 'windows'
        run: flutter config --enable-windows-desktop

      - name: Enable macOS desktop
        if: matrix.platform == 'macos'
        run: flutter config --enable-macos-desktop

      - name: Build Windows release
        if: matrix.platform == 'windows'
        run: >
          flutter build windows --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}

      - name: Build macOS release
        if: matrix.platform == 'macos'
        run: >
          flutter build macos --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}

      - name: Package Windows build
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $zipName = "procheck-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $zipName
          Get-FileHash -Algorithm SHA256 $zipName | ForEach-Object { "$($_.Hash.ToLower())  $zipName" } |
            Out-File -Encoding ascii "SHA256SUMS-windows.txt"

      - name: Package macOS build
        if: matrix.platform == 'macos'
        run: |
          zip_name="procheck-macos-${{ github.ref_name }}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/procheck.app "$zip_name"
          shasum -a 256 "$zip_name" > SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: procheck-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            procheck-${{ matrix.platform }}-${{ github.ref_name }}.zip
            SHA256SUMS-${{ matrix.platform }}.txt
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble release files
        run: |
          mkdir -p release
          find dist -name '*.zip' -exec cp {} release/ \;
          cat dist/*/SHA256SUMS-*.txt > release/SHA256SUMS.txt

      # The in-app updater reads latest.json from this public bucket (the repo
      # is private, so GitHub Releases can't be read anonymously). Zips go up
      # first so the manifest never points at a missing file.
      - name: Publish to Supabase Storage (in-app updater)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$SERVICE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret is not set; skipping in-app updater publish"
            exit 0
          fi
          auth=(-H "apikey: $SERVICE_KEY")
          case "$SERVICE_KEY" in sb_*) ;; *) auth+=(-H "Authorization: Bearer $SERVICE_KEY") ;; esac
          upload() {
            curl -fsS -X POST "$SUPABASE_URL/storage/v1/object/updates/$1"               "${auth[@]}" -H "x-upsert: true" -H "Content-Type: $3" --data-binary "@$2" > /dev/null
          }
          public="$SUPABASE_URL/storage/v1/object/public/updates"
          for z in release/*.zip; do
            upload "$TAG/$(basename "$z")" "$z" application/zip
          done
          sha() { grep " procheck-$1-" release/SHA256SUMS.txt | head -1 | cut -d' ' -f1; }
          jq -n             --arg version "${TAG#v}"             --arg wurl "$public/$TAG/procheck-windows-$TAG.zip" --arg wsha "$(sha windows)"             --arg murl "$public/$TAG/procheck-macos-$TAG.zip" --arg msha "$(sha macos)"             '{version: $version, notes: "",
              windows: {url: $wurl, sha256: $wsha},
              macos: {url: $murl, sha256: $msha}}' > latest.json
          cat latest.json
          upload latest.json latest.json application/json

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ProCheck ${{ github.ref_name }}"
          body: |
            Built by CI from commit ${{ github.sha }}.

            **macOS:** download the `procheck-macos-*.zip` below, unzip it, and
            drag `procheck.app` to Applications. This build is not code-signed
            or notarized, so macOS Gatekeeper will block it on first launch.
            Right-click (or Control-click) the app, choose "Open", then confirm
            "Open" in the dialog that appears — you only need to do this once.

            **Windows:** download the `procheck-windows-*.zip` below, unzip it,
            and run `procheck.exe`.

            `SHA256SUMS.txt` lists the checksum for each zip above.
          prerelease: false
          files: release/*
