name: Windows build

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: >
          flutter build windows --release
          --dart-define=SUPABASE_URL=https://xfcmumvfaknprmgisaar.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_M932WvNHZ6hMs23ugQmskw_JbFNhEO0

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | Select-Object -First 1
          $pubspecVersion = $versionLine.Matches[0].Groups[1].Value.Trim()
          $semver = $pubspecVersion.Split('+')[0]
          $tag = "v$semver"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "semver=$semver" >> $env:GITHUB_OUTPUT

      - name: Check for existing release
        id: check_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Package build output
        id: package
        shell: pwsh
        run: |
          $zipName = "procheck-windows-${{ steps.version.outputs.tag }}.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $zipName
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: procheck-windows-${{ steps.version.outputs.tag }}
          path: ${{ steps.package.outputs.zip_name }}
          retention-days: 30

      - name: Publish to GitHub Releases
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "ProCheck v${{ steps.version.outputs.semver }}"
          body: |
            Built by CI from commit ${{ github.sha }} on `${{ github.ref_name }}`.

            **macOS:** download the `procheck-macos-*.zip` below, unzip it, and
            drag `procheck.app` to Applications. This build is not code-signed
            or notarized, so macOS Gatekeeper will block it on first launch.
            Right-click (or Control-click) the app, choose "Open", then confirm
            "Open" in the dialog that appears — you only need to do this once.

            **Windows:** download the `procheck-windows-*.zip` below, unzip it,
            and run `procheck.exe`.
          prerelease: false
          files: ${{ steps.package.outputs.zip_name }}
